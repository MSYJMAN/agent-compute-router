[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-compute-router"
version = "0.1.0"
description = "A local-first compute routing layer for AI agents, with skeptical quantum escalation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Jermaine Williams"}]
keywords = ["ai-agents", "optimization", "mcp", "quantum-computing", "developer-tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
compute-router = "compute_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
