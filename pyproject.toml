[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-compute-router"
version = "0.2.0"
description = "A local-first compute routing layer for AI agents, with evidence-based escalation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jermaine Williams"}]
keywords = ["ai-agents", "optimization", "mcp", "quantum-computing", "developer-tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

# Ranges are kept wide deliberately. ortools 9.10-9.12 ship no cp313 wheels, so
# on Python 3.13 pip resolves to 9.13 or newer; narrowing the floor would drop
# working 3.11/3.12 installations for no benefit.
[project.optional-dependencies]
cp-sat = ["ortools>=9.10,<10"]
quantum-hybrid = ["dwave-ocean-sdk>=9.4,<10"]
full = [
  "ortools>=9.10,<10",
  "dwave-ocean-sdk>=9.4,<10"
]

[project.scripts]
compute-router = "compute_router.cli:main"

[project.urls]
Homepage = "https://github.com/MSYJMAN/agent-compute-router"
Repository = "https://github.com/MSYJMAN/agent-compute-router"
Issues = "https://github.com/MSYJMAN/agent-compute-router/issues"

[tool.setuptools.packages.find]
where = ["src"]
