name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history is required to prove the tag belongs to main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Without this gate, tagging any commit on any branch -- including an
      # abandoned release branch -- would publish a release.
      - name: Verify tag commit is contained in main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of origin/main."
            echo "Merge the release branch to main before tagging."
            exit 1
          fi
          echo "Ancestry gate passed: ${GITHUB_SHA} is contained in main."

      - name: Verify tag matches project version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Expected v-prefixed tag, got {tag}")

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag} does not match pyproject.toml version {expected}")

          print(f"Version gate passed: {tag}")
          PY

      - name: Install package with release dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[full]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify changelog contains version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq "## [${VERSION}]" CHANGELOG.md || {
            echo "CHANGELOG.md is missing an entry for ${VERSION}"
            exit 1
          }

      - name: Build package artifacts
        run: python -m build

      - name: Verify built artifacts exist and match the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/agent_compute_router-${VERSION}.tar.gz" \
            || { echo "missing sdist for ${VERSION}"; exit 1; }
          test -f "dist/agent_compute_router-${VERSION}-py3-none-any.whl" \
            || { echo "missing wheel for ${VERSION}"; exit 1; }
          ls -l dist/

      - name: Smoke test the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/python -m pip install --upgrade pip
          /tmp/release-smoke/bin/python -m pip install "$(ls dist/*.whl)[full]"
          python scripts/smoke_installed_wheel.py /tmp/release-smoke/bin/compute-router

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --title "Agent Compute Router ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
