name: CI

# Release branches are covered by their pull request. Watching both `push` on
# release/** and `pull_request` ran every release-branch commit twice.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install full local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # A package that builds is not necessarily a package that installs and
      # runs. Install the built wheel into a clean environment and exercise the
      # CLI entry point, with no editable install on the path.
      - name: Smoke test the built wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install "$(ls dist/*.whl)[full]"
          python scripts/smoke_installed_wheel.py /tmp/smoke/bin/compute-router
